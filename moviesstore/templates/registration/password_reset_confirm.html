{% extends 'base.html' %}
{% block content %}
<div class="p-3 mt-4">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8">
        <div class="card shadow p-3 mb-4 rounded">
          <div class="card-body">
            {% if validlink %}
                <h2>Reset Password</h2>
                <hr />
                <form method="POST">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit"
                        class="btn bg-dark text-white">Reset Password
                    </button>
                </form>
            {% else %}
                <p> Password reset link was invalid. Please fill out the reset form again.</p>
            {% endif %}
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock content %}
